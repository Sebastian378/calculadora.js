<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calculadora">
        <input type="text" id="pantalla" readonly>
        <div class="fila1">
            <button class="btn2">⌫</button>
            <button class="btn2">AC</button>
            <button class="btn2">%</button>
            <button class="btn1">÷</button>
        </div>
        <div class="fila2">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="btn1">X</button>

        </div>
        <div class="fila3">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="btn1">-</button>
        </div>
        <div class="fila4">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="btn1">+</button>
        </div>
        <div class="fila5">
            <button>-/+</button>
            <button>0</button>
            <button>,</button>
            <button class="btn1">=</button>
        </div>
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
